<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#08080b" />
<meta name="robots" content="noindex" />
<title>Offline — Flaredrift</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:#050505;color:#f2eee8;font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100svh;display:flex;flex-direction:column}
  header{height:68px;padding:0 6.1vw;display:flex;align-items:center;border-bottom:1px solid rgba(242,238,232,.17)}
  .wordmark{font-size:19px;letter-spacing:-.075em;font-weight:800;color:inherit;text-decoration:none}
  .wordmark span{color:#ff4322}
  main{flex:1;display:grid;align-content:center;padding:8vh 6.1vw;max-width:980px;position:relative}
  .eyebrow{font:10px ui-monospace,'DM Mono',monospace;letter-spacing:.13em;color:#a29b93;text-transform:uppercase;display:flex;align-items:center;gap:11px;margin-bottom:30px}
  .dot{width:6px;height:6px;border-radius:50%;background:#ff4322;box-shadow:0 0 12px #ff4322}
  h1{font-size:clamp(48px,10vw,116px);line-height:.9;letter-spacing:-.09em;font-weight:700;margin:0 0 28px}
  h1 em{font-family:Georgia,serif;font-style:italic;font-weight:400;color:#a49a90;letter-spacing:-.05em}
  h1 .p{color:#ff4322}
  p{font-size:14px;line-height:1.85;color:#aaa39c;max-width:460px;margin:0 0 34px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  button,.link{font:600 12px 'Manrope',system-ui,sans-serif;color:#fff;background:none;border:1px solid #514b46;padding:13px 17px;display:inline-flex;align-items:center;gap:9px;cursor:pointer;text-decoration:none;transition:border-color .2s,background .2s}
  button{border-color:#ff4322;background:#ff4322;color:#050505}
  button:hover{background:#ff6848;border-color:#ff6848}
  .link:hover{border-color:#a29b93}
  svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .geo{position:absolute;right:6vw;top:50%;transform:translateY(-50%);width:min(34vw,300px);aspect-ratio:1;pointer-events:none;opacity:.9}
  .geo i{position:absolute;display:block}
  .geo .ring{inset:0;border:1px solid #514b46;border-radius:50%}
  .geo .sq{inset:22%;border:1px solid #287dff;transform:rotate(12deg)}
  .geo .dt{width:16%;aspect-ratio:1;border-radius:50%;background:#ff4322;right:6%;top:50%}
  .note{margin-top:46px;padding-top:15px;border-top:1px solid rgba(242,238,232,.17);font:10px ui-monospace,'DM Mono',monospace;letter-spacing:.08em;color:#8c857e}
  @media(max-width:720px){.geo{display:none}header{padding:0 22px}main{padding:7vh 22px}}
</style>
</head>
<body>
<header><a class="wordmark" href="/">FLAREDRIFT<span>.</span></a></header>
<main>
  <div class="geo" aria-hidden="true"><i class="ring"></i><i class="sq"></i><i class="dt"></i></div>
  <div class="eyebrow"><span class="dot"></span>NO CONNECTION</div>
  <h1>Drifted<br><em>out of range</em><span class="p">.</span></h1>
  <p>Flaredrift can't reach the network right now. Pages and experiments you have already opened on this device stay available offline.</p>
  <div class="row">
    <button type="button" id="retry">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      Try again
    </button>
    <a class="link" href="/">Home</a>
    <a class="link" href="/ventures/">Ventures</a>
    <a class="link" href="/vision/">Vision</a>
  </div>
  <div class="note">THE OFFLINE VERSION OF FLAREDRIFT / EXPERIMENTS RUN LOCALLY ONCE CACHED</div>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () { location.reload(); });
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
